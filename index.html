<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Home Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="1800" />

  <style>
    :root{
      --safeTop: 2px;
      --safeRight: 2px;
      --safeBottom: 2px;
      --safeLeft: 2px;

      --eventTimeCol: 84px;

      /* Dark mode */
      --bg: #000;
      --frame: #000;
      --card: #161616;

      --border-soft: rgba(255,255,255,0.18);
      --text-main: #f5f5f5;
      --text-muted: rgba(245,245,245,0.72);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ width:100%; height:100%; overflow:hidden; }
    body{
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    #rotator{
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #bleed{
      position:absolute;
      inset:-6%;
      background: var(--frame);
      z-index:0;
    }

    #safe{
      position:absolute;
      inset:0;
      padding:
        calc(var(--safeTop) + env(safe-area-inset-top))
        calc(var(--safeRight) + env(safe-area-inset-right))
        calc(var(--safeBottom) + env(safe-area-inset-bottom))
        calc(var(--safeLeft) + env(safe-area-inset-left));
      z-index:1;
      overflow:hidden;
    }

    .frame{
      width:100%;
      height:100%;
      display:grid;
      grid-template-rows:auto auto 1fr;
      gap:2px;
      overflow:hidden;
    }

    /* HEADER */
    .header{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:2px 0 2px;
    }

    .time-block{
      display:flex;
      align-items:baseline;
      gap:6px;
      white-space:nowrap;
      z-index:2;
    }

    .time-main{
      font-size:40px;
      font-weight:500;
      line-height:1;
    }

    .ampm{
      font-size:14px;
      font-weight:650;
      color:var(--text-muted);
      letter-spacing:0.6px;
    }

    /* Absolute center, always screen-centered */
    .date-center{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      font-size:56px;
      font-weight:800;
      line-height:1;
      white-space:nowrap;
      max-width:70%;
      overflow:hidden;
      text-overflow:ellipsis;
      z-index:1;
      pointer-events:none;
    }

    .weather-main{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      text-align:right;
      white-space:nowrap;
      z-index:2;
    }

    .weather-temp{
      font-size:40px;
      font-weight:800;
      line-height:1;
    }

    .weather-line{
      font-size:14px;
      color:var(--text-muted);
      line-height:1.1;
    }

    /* FORECAST */
    .forecast-row{
      position:relative;
      border-top:1px solid var(--border-soft);
      border-bottom:1px solid var(--border-soft);
      padding:2px 0 2px;
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:10px;
      overflow:hidden;
    }

    /* separators between boxes only (no outer right edge) */
    .forecast-day:not(:first-child){
      border-left:1px solid var(--border-soft);
    }

    .forecast-day{
      padding:2px 6px;
      border-radius:10px;
      overflow:hidden;
      min-width:0;
    }

    .forecast-top{
      font-weight:800;
      font-size:26px;
      line-height:1;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-bottom:2px;
    }

    .forecast-bottom{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .forecast-iconbig{
      font-size:28px;
      width:34px;
      text-align:center;
      flex:0 0 auto;
      line-height:1;
    }

    .forecast-right{
      flex:1 1 auto;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .forecast-temps{
      font-size:16px;
      font-weight:800;
      white-space:nowrap;
      line-height:1.1;
    }

    .forecast-condline{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:8px;
      min-width:0;
    }

    .forecast-cond{
      font-size:13px;
      color:var(--text-muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      flex:1 1 auto;
      min-width:0;
    }

    .forecast-pop{
      font-size:13px;
      color:var(--text-muted);
      font-weight:800;
      white-space:nowrap;
      flex:0 0 auto;
    }

    /* MAIN */
    .main{
      display:grid;
      grid-template-columns:1.2fr 1fr;
      gap:2px;
      overflow:hidden;
      min-width:0;
    }
    .main > *{ min-width:0; }

    .card{
      background:var(--card);
      border-radius:16px;
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      min-height:0;
      overflow:hidden;
    }

    .card-header{
      font-size:16px;
      font-weight:800;
      margin-bottom:6px;
      text-align:center;
      text-decoration:underline;
      text-underline-offset:6px;
      text-decoration-color: rgba(255,255,255,0.55);
      flex: 0 0 auto;
    }

    /* EVENTS + PRIORITY (no scrollbars, hard clip) */
    #events-body{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      overflow:hidden;
    }

    #events-viewport{
      position:absolute;
      left:0;
      right:0;
      top:0;
      bottom:0;
      overflow:hidden;
      padding-right:12px; /* right safety so nothing hits the wall */
    }

    #events-list{
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:hidden;
      min-width:0;
    }

    .events-day{
      font-size:14px;
      font-weight:800;
      margin-top:2px;
    }

    .event-item{
      display:grid;
      grid-template-columns:22px 1fr;
      column-gap:10px;
      align-items:start;
      min-width:0;
    }
    .event-item > div{ min-width:0; }

    .event-emoji{
      width:22px;
      text-align:center;
      font-size:18px;
      line-height:1;
      margin-top:2px;
    }

    .event-top{
      display:grid;
      grid-template-columns: minmax(0,1fr) var(--eventTimeCol);
      align-items:start;
      column-gap:10px;
      min-width:0;
    }

    .event-title{
      font-size:13px;
      font-weight:500;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.2;
      min-width:0;
    }

    .event-loc{
      font-size:11px;
      font-weight:450;
      color:var(--text-muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.2;
      min-width:0;
    }

    .event-time{
      display:flex;
      align-items:baseline;
      justify-content:flex-end;
      white-space:nowrap;

      width: var(--eventTimeCol);
      min-width: var(--eventTimeCol);

      padding-left: 6px;
      padding-right: 10px; /* extra Fire TV safety */
      box-sizing: border-box;

      overflow:visible;
    }

    .event-time-main{
      font-size:14px;
      font-weight:850;
      line-height:1;
    }

    .event-time-ampm{
      font-size:9px;
      font-weight:850;
      color:var(--text-muted);
      line-height:1;
      margin-left:0;
    }

    /* Priority panel inside Events card */
    #priority-panel{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:none; /* only show when real text exists */
      overflow:hidden;
    }

    #priority-inner{
      display:flex;
      flex-direction:column;
      justify-content:flex-end; /* header sits right above the list at the bottom */
      gap:6px;
    }

    #priority-header{
      font-size:16px;
      font-weight:800;
      text-align:center;
      text-decoration:underline;
      text-underline-offset:6px;
      text-decoration-color: rgba(255,255,255,0.55);
      margin:0;
      padding:0;
    }

    #priority-list{
      list-style-type: disc;
      list-style-position: outside;
      padding-left:18px;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:8px; /* tighter like Today’s Tasks */
      min-width:0;
    }

    #priority-list li{
      font-size:14px;
      line-height:1.2;
      color:var(--text-main);
      min-width:0;

      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* TASKS (wheel marquee, no jump) */
    #tasks-list{
      overflow:hidden;
      min-height:0;
      flex:1 1 auto;
      padding-right:10px;
      position:relative; /* viewport for wheel */
    }

    #tasks-wheel{
      position:absolute;
      left:0;
      right:0;
      top:0;
      will-change: transform;
      transform: translate3d(0,0,0);
    }

    #tasks-inner{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .task-location{
      font-size:14px;
      font-weight:800;
      margin-top:2px;
    }

    .task-line{
      display:flex;
      align-items:flex-start;
      gap:8px;
      padding-left:0;
      min-width:0;
    }

    .task-emoji{
      width:22px;
      text-align:center;
      flex:0 0 auto;
      font-size:18px;
      line-height:1;
      margin-top:1px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .task-text{
      font-size:14px;
      min-width:0;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    /* Rotation */
    html.rotate90cw #rotator{
      width: 100vh;
      height: 100vw;
      transform-origin: 0 0;
      transform: rotate(90deg) translate(0, -100%);
    }
    html.rotate90ccw #rotator{
      width: 100vh;
      height: 100vw;
      transform-origin: 0 0;
      transform: rotate(-90deg) translate(-100%, 0);
    }

    /* Debug overlay */
    #debugBox{
      position:fixed;
      left:6px;
      right:6px;
      bottom:6px;
      background:rgba(255,0,0,0.18);
      border:1px solid rgba(255,0,0,0.35);
      color:#fff;
      font: 12px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding:8px;
      border-radius:10px;
      z-index:9999;
      display:none;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <div id="rotator">
    <div id="bleed" aria-hidden="true"></div>

    <div id="safe">
      <div class="frame">

        <header class="header">
          <div class="time-block">
            <div class="time-main" id="clock">4:10</div>
            <div class="ampm" id="ampm">PM</div>
          </div>

          <div class="date-center" id="date-center">Thu, Jan 1</div>

          <div class="weather-main">
            <div class="weather-stack">
              <div class="weather-temp" id="weather-temp">26°</div>
              <div class="weather-line" id="weather-line">Feels like 22°</div>
            </div>
          </div>
        </header>

        <section class="forecast-row" id="forecast-row"></section>

        <main class="main">
          <section class="card" id="events-card">
            <div class="card-header">Upcoming Events</div>

            <div id="events-body">
              <div id="events-viewport">
                <div id="events-list"><div class="event-title">Loading events…</div></div>
              </div>

              <div id="priority-panel" aria-label="Priority Tasks">
                <div id="priority-inner">
                  <div id="priority-header">Priority Tasks</div>
                  <ul id="priority-list"></ul>
                </div>
              </div>
            </div>
          </section>

          <section class="card" id="tasks-card">
            <div class="card-header">Today’s Tasks</div>
            <div id="tasks-list">
              <div id="tasks-wheel">
                <div id="tasks-inner"><div class="task-text">Loading tasks…</div></div>
              </div>
            </div>
          </section>
        </main>

      </div>
    </div>
  </div>

  <div id="debugBox"></div>

  <script>
    // On-screen JS error reporting (so you see the actual issue on TV)
    (function(){
      const box = document.getElementById("debugBox");
      function show(msg){
        box.style.display = "block";
        box.textContent = msg;
      }
      window.addEventListener("error", (e) => {
        show("JS ERROR:\n" + (e.message || "Unknown") + "\n" + (e.filename || "") + ":" + (e.lineno || "") );
      });
      window.addEventListener("unhandledrejection", (e) => {
        show("PROMISE ERROR:\n" + (e.reason ? String(e.reason) : "Unknown"));
      });
    })();

    const FORCE_ROTATION = "cw"; // "cw" or "ccw"

    function applyLayoutMode(){
      document.documentElement.classList.remove("rotate90cw", "rotate90ccw");
      document.documentElement.classList.add(FORCE_ROTATION === "cw" ? "rotate90cw" : "rotate90ccw");
    }
    window.addEventListener("resize", applyLayoutMode);

    function pad2(n){ return String(n).padStart(2, "0"); }

    function formatTime12(now){
      let h = now.getHours();
      const m = now.getMinutes();
      const ap = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return { time: h + ":" + pad2(m), ampm: ap };
    }

    function formatDateShort(now){
      const dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      const mos  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return dows[now.getDay()] + ", " + mos[now.getMonth()] + " " + now.getDate();
    }

    function updateClock(){
      const now = new Date();
      const t = formatTime12(now);
      document.getElementById("clock").textContent = t.time;
      document.getElementById("ampm").textContent = t.ampm;
      document.getElementById("date-center").textContent = formatDateShort(now);
    }

    function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
    function lerp(a,b,t){ return a + (b-a)*t; }

    // Smooth gradient mapping in HSL across temperature range
    function tempToHsl(tempF){
      const pts = [
        { t: -10, h: 220, s: 95, l: 55 },
        { t:  20, h: 205, s: 95, l: 55 },
        { t:  37, h: 192, s: 95, l: 55 },
        { t:  50, h: 165, s: 90, l: 55 },
        { t:  65, h: 120, s: 85, l: 55 },
        { t:  75, h:  60, s: 95, l: 55 },
        { t:  85, h:  30, s: 95, l: 55 },
        { t: 100, h:   0, s: 95, l: 55 },
        { t: 110, h: 350, s: 95, l: 55 }
      ];

      const tf = clamp(tempF, pts[0].t, pts[pts.length-1].t);
      let i = 0;
      while (i < pts.length-1 && tf > pts[i+1].t) i++;

      const a = pts[i], b = pts[i+1];
      const span = (b.t - a.t) || 1;
      const u = clamp((tf - a.t) / span, 0, 1);

      return {
        h: lerp(a.h, b.h, u),
        s: lerp(a.s, b.s, u),
        l: lerp(a.l, b.l, u)
      };
    }

    function applyTempColor(){
      const el = document.getElementById("weather-temp");
      const m = (el.textContent || "").match(/-?\d+/);
      if (!m) return;
      const tempF = parseInt(m[0], 10);
      const c = tempToHsl(tempF);
      el.style.color = "hsl(" + c.h + " " + c.s + "% " + c.l + "%)";
    }

    async function loadWeather(){
      try{
        const res = await fetch("weather.txt", { cache: "no-store" });
        if (!res.ok) return;
        const text = (await res.text()).trim();
        if (!text) return;

        const tempMatch = text.match(/(-?\d+)\s*°/);
        const feelsMatch = text.match(/Feels\s*like[:\s]*(-?\d+)\s*°/i);

        if (tempMatch) document.getElementById("weather-temp").textContent = tempMatch[1] + "°";
        if (feelsMatch) document.getElementById("weather-line").textContent = "Feels like " + feelsMatch[1] + "°";

        applyTempColor();
      } catch(e){
        console.log(e);
      }
    }

    function ordinal(n){
      const v = n % 100;
      if (v >= 11 && v <= 13) return n + "th";
      const last = n % 10;
      if (last === 1) return n + "st";
      if (last === 2) return n + "nd";
      if (last === 3) return n + "rd";
      return n + "th";
    }

    function calendarEmoji(calName){
      const s = (calName || "").trim();
      const low = s.toLowerCase();

      const first = Array.from(s)[0] || "";
      if (first && !(/[A-Za-z0-9]/.test(first))) return first;

      if (low.includes("holidays")) return "🇺🇸";
      if (low.includes("work")) return "💊";
      if (low.includes("church")) return "⛪️";
      if (low.includes("victoria")) return "👸";
      if (low.includes("family")) return "👨‍👩‍👧‍👦";
      if (low.includes("home")) return "🏡";
      if (low.includes("school")) return "🏫";
      return "📅";
    }

    function parseStart(startStr){
      const s = (startStr || "").trim();
      const out = { dateKey:"", dayLabel:"", timeMain:"", timeAmPm:"", allDay:false };

      const dateM = s.match(/([A-Za-z]{3,})\s+(\d{1,2}),\s*(\d{4})/i);
      if (!dateM) return out;

      const monStr = dateM[1].slice(0,3).toLowerCase();
      const dayNum = parseInt(dateM[2], 10);
      const yearNum = parseInt(dateM[3], 10);

      const months = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
      const monthIdx = months.indexOf(monStr);
      if (monthIdx < 0) return out;

      const dt = new Date(yearNum, monthIdx, dayNum);
      const dows = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const mosFull = ["January","February","March","April","May","June","July","August","September","October","November","December"];

      out.dateKey = yearNum + "-" + (monthIdx+1) + "-" + dayNum;
      out.dayLabel = dows[dt.getDay()] + " - " + mosFull[monthIdx] + " " + ordinal(dayNum);

      if (/all\s*day/i.test(s)){
        out.allDay = true;
        return out;
      }

      const timeM = s.match(/at\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if (timeM){
        out.timeMain = parseInt(timeM[1], 10) + ":" + timeM[2];
        out.timeAmPm = timeM[3].toUpperCase();
      }
      return out;
    }

    function stripZip(s){
      return (s || "")
        .replace(/\b\d{5}(?:-\d{4})?\b/g, "")
        .replace(/\s{2,}/g, " ")
        .replace(/\s+,/g, ",")
        .trim();
    }

    function normalizeCountryUS(s){
      return (s || "")
        .replace(/\bUnited States of America\b/ig, "United States")
        .replace(/\bU\.S\.A\.\b/ig, "United States")
        .replace(/\bUSA\b/ig, "United States")
        .replace(/\bU\.S\.\b/ig, "United States")
        .replace(/\bUS\b/ig, "United States");
    }

    function tidyCommas(s){
      return (s || "")
        .replace(/,\s*,+/g, ",")
        .replace(/,\s*$/g, "")
        .trim();
    }

    function isIndianaToken(tok){
      const t = (tok || "").trim().toUpperCase();
      return t === "IN" || t === "INDIANA";
    }

    function twoLetterState(tok){
      const t = (tok || "").trim().toUpperCase();
      return /^[A-Z]{2}$/.test(t) ? t : "";
    }

    function extractCityFromAddressPrefix(prefix){
      // prefix like "16125 Creeks Bend Ct Westfield" or "1191 W. 86th St Indianapolis"
      const p = (prefix || "").trim();
      if (!p) return "";

      const suffixRe = /\b(St|Street|Rd|Road|Dr|Drive|Ct|Court|Ave|Avenue|Blvd|Boulevard|Ln|Lane|Pkwy|Parkway|Way|Pl|Place|Ter|Terrace|Cir|Circle|Trl|Trail)\b\.?\s+(.+)$/i;
      const m = p.match(suffixRe);
      if (m && m[2]) return m[2].trim();

      const parts = p.split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "";
      return parts[parts.length - 1];
    }

    function compactAddress(prefix){
      // "16125 Creeks Bend Ct Westfield" -> "16125 Creeks Bend Ct, Westfield"
      const p = (prefix || "").trim();
      if (!p) return "";

      const city = extractCityFromAddressPrefix(p);
      if (!city) return p;

      const idx = p.lastIndexOf(city);
      if (idx <= 0) return p;

      const street = p.slice(0, idx).trim().replace(/[,\-]\s*$/,"").trim();
      if (!street) return city;
      return street + ", " + city;
    }

    function cleanLocation(raw){
      let s = (raw || "").trim();
      if (!s) return "";

      s = normalizeCountryUS(s);

      const lines = s.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      const venue = lines.length > 1 ? lines[0] : "";
      const addrLine = lines.length > 1 ? lines.slice(1).join(" ") : lines[0];

      let addr = tidyCommas(stripZip(addrLine));

      // Split by commas to detect state/country tokens
      let parts = addr.split(",").map(p => stripZip(p.trim())).filter(Boolean);

      const hasUS = parts.some(p => /^United States$/i.test(p));
      let country = "";
      const canadaIdx = parts.findIndex(p => /^Canada$/i.test(p));
      if (canadaIdx >= 0) country = "Canada";

      // Find state token (US)
      let state = "";
      for (let i = parts.length - 1; i >= 0; i--){
        const tok = parts[i];
        const st = twoLetterState(tok);
        if (st){
          state = st;
          break;
        }
        if (/^Indiana$/i.test(tok)){
          state = "IN";
          break;
        }
      }

      // If Canada, show "City, Canada" (drop province if present)
      if (country === "Canada"){
        // Try to get city from the first segment (usually contains street+city)
        const firstSeg = parts[0] || "";
        const city = extractCityFromAddressPrefix(firstSeg) || "";
        const cityOut = city ? (city + ", Canada") : "Canada";
        return venue ? (venue + ", " + cityOut) : cityOut;
      }

      // US logic
      if (hasUS){
        parts = parts.filter(p => !/^United States$/i.test(p));
      }

      // Indiana: drop state token entirely
      const inIndiana = state === "IN" || parts.some(isIndianaToken);
      if (inIndiana){
        parts = parts.filter(p => !isIndianaToken(p));
        // Build compact street+city from first segment where possible
        const firstSeg = parts[0] || "";
        const addrOut = /^\d/.test(firstSeg) ? compactAddress(firstSeg) : firstSeg;
        return venue ? (venue + ", " + (extractCityFromAddressPrefix(firstSeg) || addrOut || "")) : (addrOut || "");
      }

      // Other US state: keep City, ST (and optionally compact address if no venue)
      if (state){
        // remove any full-state name tokens, keep the two-letter state
        parts = parts.filter(p => !/^[A-Za-z ]+$/.test(p) || !isIndianaToken(p));
        const firstSeg = parts[0] || "";
        const city = extractCityFromAddressPrefix(firstSeg) || "";
        const cityState = city ? (city + ", " + state) : state;
        return venue ? (venue + ", " + cityState) : cityState;
      }

      // Fallback: just return cleaned, clipped by CSS
      const fallback = tidyCommas(stripZip(addr));
      return venue ? (venue + ", " + fallback) : fallback;
    }

    function layoutEventsAndPriority(){
      const viewport = document.getElementById("events-viewport");
      const priority = document.getElementById("priority-panel");
      if (!viewport || !priority) return;

      // Reserve space for priority panel by shrinking the visible events viewport
      if (priority.style.display === "none"){
        viewport.style.bottom = "0px";
      } else {
        const h = priority.offsetHeight || 0;
        viewport.style.bottom = h + "px";
      }

      clipEventsToViewport();
    }

    function clipEventsToViewport(){
      const viewport = document.getElementById("events-viewport");
      const list = document.getElementById("events-list");
      if (!viewport || !list) return;

      const kids = Array.from(list.children);
      kids.forEach(el => { el.style.display = ""; });

      const vh = viewport.clientHeight;

      // Hide first element that would be clipped, plus everything after it
      let cutIndex = kids.length;
      for (let i = 0; i < kids.length; i++){
        const el = kids[i];
        const bottom = el.offsetTop + el.offsetHeight;
        if (bottom > vh){
          cutIndex = i;
          break;
        }
      }
      for (let i = cutIndex; i < kids.length; i++){
        kids[i].style.display = "none";
      }

      // Hide orphan day headers (a header with no visible event-item under it)
      for (let i = 0; i < kids.length; i++){
        const el = kids[i];
        if (el.style.display === "none") continue;
        if (!el.classList.contains("events-day")) continue;

        let hasVisibleEvent = false;
        for (let j = i + 1; j < kids.length; j++){
          const nxt = kids[j];
          if (nxt.classList.contains("events-day")) break;
          if (nxt.style.display !== "none" && nxt.classList.contains("event-item")){
            hasVisibleEvent = true;
            break;
          }
        }
        if (!hasVisibleEvent){
          el.style.display = "none";
        }
      }
    }

    async function loadEvents(){
      const container = document.getElementById("events-list");
      try{
        const res = await fetch("calendar.txt", { cache: "no-store" });
        if (!res.ok) return;

        const text = await res.text();
        container.innerHTML = "";

        const rawLines = text.split("\n").map(l => l.trim()).filter(Boolean);

        const rebuilt = [];
        const eventStartRe = /\s\|\s*[A-Za-z]{3}\s+\d{1,2},\s*\d{4}\s+(at\s+\d|all\s*day)/i;
        let buf = "";

        for (const ln of rawLines){
          const isStart = ln.includes(" | ") && eventStartRe.test(ln);
          if (isStart){
            if (buf) rebuilt.push(buf.trim());
            buf = ln;
          } else {
            buf = buf ? (buf + " " + ln) : ln;
          }
        }
        if (buf) rebuilt.push(buf.trim());

        const lines = rebuilt.slice(0, 10);
        if (lines.length === 0){
          container.innerHTML = '<div class="event-title">No events scheduled.</div>';
          layoutEventsAndPriority();
          return;
        }

        const events = [];
        for (const line of lines){
          const parts = line.split(" | ").map(p => p.trim());
          if (parts.length < 2) continue;

          const title = parts[0] || "";
          const start = parts[1] || "";
          const locRaw = parts[2] || "";
          const calName = parts[3] || "";
          const parsed = parseStart(start);

          events.push({
            title: title,
            loc: cleanLocation(locRaw),
            calEmoji: calendarEmoji(calName),
            dateKey: parsed.dateKey,
            dayLabel: parsed.dayLabel,
            timeMain: parsed.timeMain,
            timeAmPm: parsed.timeAmPm,
            allDay: parsed.allDay
          });
        }

        let lastKey = null;

        for (const ev of events){
          if (ev.dateKey && ev.dateKey !== lastKey){
            lastKey = ev.dateKey;
            const day = document.createElement("div");
            day.className = "events-day";
            day.textContent = ev.dayLabel || "";
            container.appendChild(day);
          }

          const timeHtml = ev.allDay
            ? '<div class="event-time"><div class="event-time-main">All day</div></div>'
            : (ev.timeMain
                ? '<div class="event-time"><div class="event-time-main">' + ev.timeMain + '</div><div class="event-time-ampm">' + ev.timeAmPm + '</div></div>'
                : '<div class="event-time"></div>');

          const item = document.createElement("div");
          item.className = "event-item";
          item.innerHTML =
            '<div class="event-emoji">' + (ev.calEmoji || "") + '</div>' +
            '<div>' +
              '<div class="event-top">' +
                '<div class="event-title">' + ev.title + '</div>' +
                timeHtml +
              '</div>' +
              (ev.loc ? '<div class="event-loc">' + ev.loc + '</div>' : '') +
            '</div>';

          container.appendChild(item);
        }

        // After events are rendered, clip them based on current priority height
        requestAnimationFrame(layoutEventsAndPriority);
      } catch(e){
        console.log(e);
      }
    }

    /* ===== Priority Tasks ===== */
    let __lastPriorityText = "";

    async function loadPriority(){
      const panel = document.getElementById("priority-panel");
      const list = document.getElementById("priority-list");
      if (!panel || !list) return;

      try{
        const res = await fetch("priority.txt", { cache: "no-store" });
        if (!res.ok) return;

        const text = (await res.text()).replace(/\r\n/g, "\n").trimEnd();

        // If unchanged, do nothing
        if (text === __lastPriorityText) return;
        __lastPriorityText = text;

        // Parse lines
        const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

        // Empty: hide section completely
        if (lines.length === 0){
          panel.style.display = "none";
          list.innerHTML = "";
          requestAnimationFrame(layoutEventsAndPriority);
          return;
        }

        // Build up to 8 tasks
        list.innerHTML = "";
        const take = lines.slice(0, 8);
        for (const t of take){
          const li = document.createElement("li");
          li.textContent = t;
          list.appendChild(li);
        }

        panel.style.display = "block";
        requestAnimationFrame(layoutEventsAndPriority);
      } catch(e){
        console.log(e);
      }
    }

    /* TASKS: wheel marquee (no jump) */
    let __tasksRaf = null;
    let __tasksLastTs = 0;
    let __tasksY = 0;
    let __tasksH = 0;
    let __lastTasksText = "";

    function ensureTasksWheel(){
      const viewport = document.getElementById("tasks-list");
      const wheel = document.getElementById("tasks-wheel");
      const trackA = document.getElementById("tasks-inner");
      if (!viewport || !wheel || !trackA) return null;
      return { viewport, wheel, trackA };
    }

    function stopTasksMarquee(){
      if (__tasksRaf) cancelAnimationFrame(__tasksRaf);
      __tasksRaf = null;
      __tasksLastTs = 0;
      __tasksY = 0;
      __tasksH = 0;

      const parts = ensureTasksWheel();
      if (!parts) return;

      const { wheel } = parts;
      wheel.style.transform = "translate3d(0,0,0)";

      const b = document.getElementById("tasks-inner-b");
      if (b) b.remove();
    }

    function startTasksMarquee(speedPxPerSec){
      const parts = ensureTasksWheel();
      if (!parts) return;

      const { viewport, wheel, trackA } = parts;

      stopTasksMarquee();

      // Let layout settle
      setTimeout(() => {
        const viewportH = viewport.clientHeight;
        const originalH = trackA.scrollHeight;

        if (originalH <= viewportH + 1) return;

        // Clone B and stack it under A inside the wheel
        const trackB = trackA.cloneNode(true);
        trackB.id = "tasks-inner-b";
        wheel.appendChild(trackB);

        // Measure exact height of one track after clone is in DOM
        __tasksH = Math.ceil(trackA.getBoundingClientRect().height);

        __tasksY = 0;
        __tasksLastTs = 0;

        function step(ts){
          if (!__tasksLastTs) __tasksLastTs = ts;

          let dt = (ts - __tasksLastTs) / 1000;
          __tasksLastTs = ts;
          dt = Math.min(dt, 0.05);

          __tasksY -= speedPxPerSec * dt;

          // Wrap seamlessly
          if (__tasksY <= -__tasksH) __tasksY += __tasksH;

          const yRender = Math.round(__tasksY);
          wheel.style.transform = "translate3d(0," + yRender + "px,0)";

          __tasksRaf = requestAnimationFrame(step);
        }

        __tasksRaf = requestAnimationFrame(step);
      }, 300);
    }

    async function loadTasks(){
      const inner = document.getElementById("tasks-inner");

      try{
        const res = await fetch("dashboard.txt", { cache: "no-store" });
        if (!res.ok) return;

        const text = await res.text();
        const normalized = text.replace(/\r\n/g, "\n").trimEnd();

        // No changes, keep current marquee running
        if (normalized === __lastTasksText) return;

        __lastTasksText = normalized;

        stopTasksMarquee();
        inner.innerHTML = "";

        const lines = normalized.split("\n").map(l => l.trim()).filter(Boolean);
        if (lines.length === 0){
          inner.innerHTML = "<div class='task-text'>No tasks for today.</div>";
          return;
        }

        const byLocation = new Map();
        for (const line of lines){
          const parts = line.split(/\s*\|\s*/).map(p => p.trim());
          if (parts.length < 3) continue;

          const location = parts[0];
          const assigneeRaw = parts[1];
          const task = parts.slice(2).join(" | ");

          if (!byLocation.has(location)) byLocation.set(location, []);
          byLocation.get(location).push({ assigneeRaw, task });
        }

        if (byLocation.size === 0){
          inner.innerHTML =
            "<div class='task-text'>No tasks parsed. Expected: Location | Assignee | Task</div>";
          return;
        }

        function emojiHTML(a){
          const key = a.replace(/\s+/g,"").toUpperCase();
          if (key === "C") return "🐧";
          if (key === "V") return "🐝";
          if (key === "C/V") return "👫";
          if (key === "R") return "🦄";
          return "";
        }

        const order = ["C","V","C/V","R"];

        for (const [location, items] of byLocation.entries()){
          const locDiv = document.createElement("div");
          locDiv.className = "task-location";
          locDiv.textContent = location;
          inner.appendChild(locDiv);

          const groups = new Map();
          for (const it of items){
            const key = it.assigneeRaw.replace(/\s+/g,"").toUpperCase();
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(it.task);
          }

          for (const a of order){
            const tasks = groups.get(a);
            if (!tasks || tasks.length === 0) continue;

            for (const t of tasks){
              const row = document.createElement("div");
              row.className = "task-line";
              row.innerHTML =
                "<div class='task-emoji'>" + emojiHTML(a) + "</div>" +
                "<div class='task-text'>" + t + "</div>";
              inner.appendChild(row);
            }
          }
        }

        startTasksMarquee(4);
      } catch(e){
        console.log(e);
      }
    }

    async function loadForecast(){
      const row = document.getElementById("forecast-row");
      try{
        const res = await fetch("prediction.txt?cb=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;

        const raw = (await res.text()).trim();
        if (!raw) return;

        const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
        const days = [];
        let i = 0;

        while (i < lines.length && days.length < 3){
          const name = lines[i++] || "";
          const line2 = lines[i++] || "";
          let condition = lines[i++] || "";
          let pop = "";

          if (!name || !line2) continue;

          if (i < lines.length && /^\d+(\.\d+)?\s*%$/.test(lines[i])) {
            pop = lines[i++];
          } else {
            const m = condition.match(/(\d+(\.\d+)?)\s*%$/);
            if (m){
              pop = m[1] + "%";
              condition = condition.replace(/\s*\d+(\.\d+)?\s*%$/, "").trim();
            }
          }

          const parts = line2.split(/\s+/).filter(Boolean);
          let emoji = "";
          let temps = "";

          if (parts.length === 1){
            temps = parts[0];
          } else if (/^[\d-]/.test(parts[0])){
            temps = parts.join(" ");
          } else {
            emoji = parts[0];
            temps = parts.slice(1).join(" ");
          }

          days.push({ name:name, emoji:emoji, temps:temps, condition:condition, pop:pop });
        }

        row.innerHTML = "";
        for (const d of days){
          const div = document.createElement("div");
          div.className = "forecast-day";

          const popSafe = (d.pop && d.pop !== "0%") ? d.pop : "";

          div.innerHTML =
            '<div class="forecast-top">' + d.name + '</div>' +
            '<div class="forecast-bottom">' +
              '<div class="forecast-iconbig">' + (d.emoji || "") + '</div>' +
              '<div class="forecast-right">' +
                '<div class="forecast-temps">' + (d.temps || "") + '</div>' +
                '<div class="forecast-condline">' +
                  '<div class="forecast-cond">' + (d.condition || "") + '</div>' +
                  (popSafe ? '<div class="forecast-pop">' + popSafe + '</div>' : '') +
                '</div>' +
              '</div>' +
            '</div>';

          row.appendChild(div);
        }
      } catch(e){
        console.log(e);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      applyLayoutMode();

      updateClock();
      loadWeather();
      loadForecast();
      loadEvents();
      loadPriority();
      loadTasks();

      setInterval(updateClock, 15000);
      setInterval(loadWeather, 300000);
      setInterval(loadForecast, 1800000);
      setInterval(loadEvents, 60000);
      setInterval(loadPriority, 60000);
      setInterval(loadTasks, 60000);
    });
  </script>
