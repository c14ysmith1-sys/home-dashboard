<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Home Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="1800" />

  <style>
    :root{
      /* If the RIGHT side is still clipping, increase --safeRight first (ex: 18px -> 26px) */
      --safeTop: 0px;
      --safeRight: 0px;
      --safeBottom: 0px;
      --safeLeft: 0px;

      --bg: #f7f2e9;
      --frame: #fdf8f1;
      --card: #ffffff;
      --border-soft: #eadfce;
      --accent: #c8905b;
      --accent-soft: #f1d4b8;
      --text-main: #3b2c22;
      --text-muted: #7b6a5b;
      --bullet: #c8905b;
    }

    *{ box-sizing: border-box; margin:0; padding:0; }
    html, body{ width:100%; height:100%; overflow:hidden; }
    body{
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    /* Rotated canvas wrapper */
    #rotator{
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Full-screen “bleed” background (allowed to be cropped) */
    #bleed{
      position: absolute;
      inset: -6%;
      background: var(--frame);
      z-index: 0;
    }

    /* Safe area to fight TV overscan */
    #safe{
      position: absolute;
      inset: 0;
      padding:
        calc(var(--safeTop) + env(safe-area-inset-top))
        calc(var(--safeRight) + env(safe-area-inset-right))
        calc(var(--safeBottom) + env(safe-area-inset-bottom))
        calc(var(--safeLeft) + env(safe-area-inset-left));
      z-index: 1;
      overflow: hidden;
    }

    /* Page container (no extra padding here, #safe owns the padding) */
    .frame{
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;

      /* “Butt to edge”: remove rounded corners and heavy shadow */
      border-radius: 0;
      background: transparent;
      box-shadow: none;

      overflow: hidden;
    }

    /* HEADER (thinner) */
.header{
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: stretch;              /* lets the center date fill height */
  column-gap: 12px;
  padding: 2px 0 2px;
  min-height: 74px;
}

.time-block{
  display:flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
  align-self: center;
}

.time-main{
  font-size: 54px;                   /* shrink clock first */
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1;
}

.ampm{
  font-size: 18px;
  font-weight: 650;
  color: var(--text-muted);
  letter-spacing: 0.8px;
}

.date-center{
  justify-self: center;
  text-align: center;

  display:flex;                      /* fill header height */
  align-items:center;
  justify-content:center;

  font-size: 56px;                   /* big date */
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 6px;
}

.weather-main{
  justify-self: end;
  display:flex;
  align-items: center;
  justify-content: flex-end;
  text-align: right;
  white-space: nowrap;
  align-self: center;
}

.weather-temp{
  font-size: 40px;                   /* shrink temp after clock */
  font-weight: 750;
  line-height: 1;
}
    .weather-line{
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.1;
    }

    /* FORECAST (next 3 days, thin banner, keep your format) */
    .forecast-row{
      position: relative;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      padding: 8px 0 8px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .forecast-row.has-separators::before{
      content:"";
      position:absolute;
      left:0; right:0;
      top:8px; bottom:8px;
      pointer-events:none;
      background-image:
        linear-gradient(
          to right,
          transparent 0,
          transparent calc(100% - 1px),
          rgba(0,0,0,0.18) calc(100% - 1px),
          rgba(0,0,0,0.18) 100%
        );
      background-size: calc(100% / 3) 100%;
      background-repeat: repeat;
    }
    .forecast-row.has-separators::after{
      content:"";
      position:absolute;
      right:0;
      top:8px;
      bottom:8px;
      width:2px;
      background: var(--frame);
      pointer-events:none;
    }

    .forecast-day{
      min-width: 0;
      padding: 4px 6px;
      border-radius: 10px;
      overflow: hidden;
    }

    .forecast-top{
      font-weight: 800;
      font-size: 26px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .forecast-bottom{
      display:flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .forecast-iconbig{
      font-size: 28px;
      line-height: 1;
      width: 34px;
      text-align: center;
      flex: 0 0 auto;
    }

    .forecast-right{
      min-width: 0;
      flex: 1 1 auto;
      display:flex;
      flex-direction: column;
      gap: 2px;
    }

    .forecast-temps{
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }

    .forecast-condline{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .forecast-cond{
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1 1 auto;
    }

    .forecast-pop{
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 800;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    /* MAIN CONTENT */
    .main{
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
      min-width: 0;
      overflow: hidden;
    }
    .main > *{ min-width:0; }

    .card{
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
      display:flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

.card-header{
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 8px;

  text-align: center;
  text-decoration: underline;
  text-underline-offset: 6px;
}

    .card-subtitle{
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

#events-card .events-list{
  overflow:auto;
  min-height:0;
  flex: 1 1 auto;
  padding-right: 6px;
  display:flex;
  flex-direction: column;
  gap: 10px;
}

    .event-item,
    .task-item{
      display:flex;
      align-items:flex-start;
      gap: 10px;
      font-size: 14px;
      min-width: 0;
    }

    .event-bar{
      width: 4px;
      border-radius: 999px;
      background: var(--accent);
      margin-top: 3px;
      flex-shrink:0;
      height: 44px;
    }
    .event-text{ flex: 1; min-width: 0; }
    .event-cal{
      font-size: 11px;
      font-weight: 750;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 2px;
    }
    .event-title{
      font-weight: 650;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 2px;
      overflow-wrap: anywhere;
    }
    .event-loc{
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
.events-day{
  font-size: 14px;
  font-weight: 800;
  color: var(--text-main);
  text-align: left;
  margin-top: 2px;
}

.event-item{
  display:grid;
  grid-template-columns: 22px 1fr auto;
  column-gap: 10px;
  align-items:start;
  font-size: 14px;
  min-width: 0;
}

.event-emoji{
  width: 22px;
  text-align: center;
  font-size: 18px;
  line-height: 1;
  margin-top: 2px;
  flex: 0 0 auto;
}

.event-main{
  min-width: 0;
  display:flex;
  flex-direction: column;
  gap: 4px;
}

.event-top{
  display:grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items:start;
  min-width: 0;
}

.event-title{
  font-weight: 750;
  color: var(--text-main);
  line-height: 1.2;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;     /* never more than 2 lines */
  overflow: hidden;
}

.event-title.noloc{
  font-size: 16px;           /* bigger when no location */
}

.event-title.hasloc{
  font-size: 14px;           /* slightly smaller when location exists */
}

.event-loc{
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.2;

  white-space: nowrap;       /* 1 line only */
  overflow: hidden;
  text-overflow: ellipsis;
}

.event-time{
  display:flex;
  align-items: baseline;
  justify-content: flex-end;
  white-space: nowrap;
}

.event-time-main{
  font-size: 18px;
  font-weight: 850;
  line-height: 1;
}

.event-time-ampm{
  font-size: 9px;
  font-weight: 850;
  color: var(--text-muted);
  line-height: 1;
  margin-left: 0;            /* no space */
}

.event-time-allday{
  font-size: 12px;
  font-weight: 850;
  color: var(--text-main);
}

    
    .dot{
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 2px solid var(--bullet);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .tasks-list{
      display:flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }
    .task-text{
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .tasks-list{
  display:flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  overflow:auto;
  min-height:0;
  flex: 1 1 auto;
}

.task-location{
  font-size: 14px;     /* same as events day heading */
  font-weight: 800;
  color: var(--text-main);
  margin-top: 2px;
}

.task-line{
  display:flex;
  align-items:flex-start;
  gap: 8px;
  padding-left: 12px;  /* gentle indent */
  min-width: 0;
}

.task-emoji{
  width: 22px;
  text-align: center;
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1;
  margin-top: 1px;
}

.task-text{
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
  font-size: 14px;
}


    /* Rotate wrapper when Fire TV is landscape so UI is portrait */
    html.rotate90 #rotator{
      width: 100vh;
      height: 100vw;
      transform-origin: 0 0;
      transform: rotate(90deg) translate(0, -100%);
    }

    /* Compact mode if the browser reports a narrow "portrait width" */
    html.compact .header{ min-height: 62px; }
    html.compact .time-main{ font-size: 56px; }
    html.compact .date-center{ font-size: 28px; }
    html.compact .weather-temp{ font-size: 40px; }
    html.compact .forecast-top{ font-size: 22px; }
  </style>
</head>

  <script>
    function pad2(n){ return n.toString().padStart(2, "0"); }

    function formatTime12(now){
      let h = now.getHours();
      const m = now.getMinutes();
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return { time: `${h}:${pad2(m)}`, ampm };
    }

    function formatDateShort(now){
      // Force "Thu, Jan 1" style regardless of device locale quirks
      const dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      const mos  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${dows[now.getDay()]}, ${mos[now.getMonth()]} ${now.getDate()}`;
    }

    function updateClock(){
      const now = new Date();
      const { time, ampm } = formatTime12(now);
      document.getElementById("clock").textContent = time;
      document.getElementById("ampm").textContent = ampm;
      document.getElementById("date-center").textContent = formatDateShort(now);
    }

    async function loadWeather(){
      try{
        const res = await fetch("weather.txt", { cache: "no-store" });
        if (!res.ok) return;
        const text = (await res.text()).trim();
        if (!text) return;

        const tempMatch = text.match(/(-?\d+)\s*°/);
        const feelsMatch = text.match(/Feels\s*like[:\s]*(-?\d+)\s*°/i);

        if (tempMatch) document.getElementById("weather-temp").textContent = `${tempMatch[1]}°`;
        if (feelsMatch) document.getElementById("weather-line").textContent = `Feels like ${feelsMatch[1]}°`;
      } catch(e){
        console.error("Error loading weather:", e);
      }
    }

    function hashToColor(str){
      const palette = ["#c8905b", "#7aa7c7", "#8bbf83", "#b58bc9", "#d88484", "#9aa6b2", "#d2a24c"];
      let hash = 0;
      for (let i=0;i<str.length;i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      return palette[hash % palette.length];
    }

   function ordinal(n){
  const v = n % 100;
  if (v >= 11 && v <= 13) return `${n}th`;
  const last = n % 10;
  if (last === 1) return `${n}st`;
  if (last === 2) return `${n}nd`;
  if (last === 3) return `${n}rd`;
  return `${n}th`;
}

function extractLeadingEmoji(calName){
  const s = (calName || "").trim();
  if (!s) return "";
  const first = Array.from(s)[0] || "";
  // crude but practical: if it's not a letter/number, treat as emoji/symbol
  if (/[\p{L}\p{N}]/u.test(first)) return "";
  return first;
}

function parseStart(startStr){
  const s = (startStr || "").trim();
  const out = {
    dateKey: "",
    dayLabel: "",
    timeMain: "",
    timeAmPm: "",
    allDay: false,
  };

  // Date: "Jan 3, 2026 ..."
  const dateM = s.match(/([A-Za-z]{3,})\s+(\d{1,2}),\s*(\d{4})/i);
  if (!dateM) return out;

  const monStr = dateM[1].slice(0,3).toLowerCase();
  const dayNum = parseInt(dateM[2], 10);
  const yearNum = parseInt(dateM[3], 10);

  const months = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const monthIdx = months.indexOf(monStr);
  if (monthIdx < 0) return out;

  const dt = new Date(yearNum, monthIdx, dayNum);
  const dows = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const mosFull = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  out.dateKey = `${yearNum}-${monthIdx+1}-${dayNum}`;
  out.dayLabel = `${dows[dt.getDay()]} - ${mosFull[monthIdx]} ${ordinal(dayNum)}`;

  // All day?
  if (/all\s*day/i.test(s)){
    out.allDay = true;
    return out;
  }

  // Time: "at 1:00PM" or "at 1:00 PM"
  const timeM = s.match(/at\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (timeM){
    const h = parseInt(timeM[1], 10);
    const mm = timeM[2];
    const ap = timeM[3].toUpperCase();
    out.timeMain = `${h}:${mm}`;
    out.timeAmPm = ap;
  }

  return out;
}

async function loadEvents(){
  try{
    const res = await fetch("calendar.txt", { cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();

    const container = document.getElementById("events-list");
    container.innerHTML = "";

    const lines = text
      .split("\n")
      .map(l => l.trim())
      .filter(l => l.length > 0)
      .slice(0, 10);

    if (lines.length === 0){
      container.innerHTML = `<div class="event-title noloc">No events scheduled.</div>`;
      return;
    }

    // Support either:
    // 3 parts: Title | Start Date | Location
    // 4 parts: Title | Start Date | Location | CalendarName(with emoji prefix)
    const events = [];

    for (const line of lines){
      const parts = line.split(" | ").map(p => p.trim());
      if (parts.length < 2) continue;

      const title = parts[0] || "";
      const start = parts[1] || "";
      const loc = parts[2] || "";
      const calName = parts[3] || "";

      const parsed = parseStart(start);

      events.push({
        title,
        start,
        loc,
        calEmoji: extractLeadingEmoji(calName),
        dateKey: parsed.dateKey,
        dayLabel: parsed.dayLabel,
        timeMain: parsed.timeMain,
        timeAmPm: parsed.timeAmPm,
        allDay: parsed.allDay
      });
    }

    // Group by dateKey (keep input order)
    let lastKey = null;

    for (const ev of events){
      if (ev.dateKey && ev.dateKey !== lastKey){
        lastKey = ev.dateKey;

        const day = document.createElement("div");
        day.className = "events-day";
        day.textContent = ev.dayLabel || "";
        if (day.textContent) container.appendChild(day);
      }

      const hasLoc = !!(ev.loc && ev.loc.trim());
      const timeHtml = ev.allDay
        ? `<div class="event-time"><div class="event-time-allday">All day</div></div>`
        : (ev.timeMain
            ? `<div class="event-time"><div class="event-time-main">${ev.timeMain}</div><div class="event-time-ampm">${ev.timeAmPm}</div></div>`
            : `<div class="event-time"></div>`);

      const item = document.createElement("div");
      item.className = "event-item";
      item.innerHTML = `
        <div class="event-emoji">${ev.calEmoji || ""}</div>
        <div class="event-main">
          <div class="event-top">
            <div class="event-title ${hasLoc ? "hasloc" : "noloc"}">${ev.title}</div>
            ${timeHtml}
          </div>
          ${hasLoc ? `<div class="event-loc">${ev.loc}</div>` : ``}
        </div>
        <div></div>
      `;
      container.appendChild(item);
    }
  } catch(e){
    console.error("Error loading events:", e);
  }
}

async function loadTasks(){
  try{
    const res = await fetch("dashboard.txt", { cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();

    const container = document.getElementById("tasks-list");
    container.innerHTML = "";

    const lines = text
      .split("\n")
      .map(l => l.trim())
      .filter(l => l.length > 0);

    if (lines.length === 0){
      container.innerHTML = `<div class="task-text">No tasks for today.</div>`;
      return;
    }

    // Parse and group: Location | Assignee | Task
    const byLocation = new Map();

    for (const line of lines){
      const parts = line.split(" | ").map(p => p.trim());
      if (parts.length < 3) continue;

      const location = parts[0];
      const assigneeRaw = parts[1];         // uppercase always
      const task = parts.slice(2).join(" | "); // just in case, though you said no pipes in task

      if (!byLocation.has(location)) byLocation.set(location, []);
      byLocation.get(location).push({ assigneeRaw, task });
    }

    const emojiFor = (a) => {
      const key = a.replace(/\s+/g, "").toUpperCase();
      if (key === "C") return "🐧";
      if (key === "V") return "🦩";
      if (key === "C/V") return "👫🏻";
      if (key === "R") return "🦄";
      return "";
    };

    const assigneeOrder = ["C", "V", "C/V", "R"];

    for (const [location, items] of byLocation.entries()){
      // Location heading
      const locDiv = document.createElement("div");
      locDiv.className = "task-location";
      locDiv.textContent = location;
      container.appendChild(locDiv);

      // Group by assignee in fixed order
      const groups = new Map();
      for (const it of items){
        const key = it.assigneeRaw.replace(/\s+/g, "").toUpperCase();
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(it.task);
      }

      for (const a of assigneeOrder){
        const tasks = groups.get(a);
        if (!tasks || tasks.length === 0) continue;

        for (const t of tasks){
          const row = document.createElement("div");
          row.className = "task-line";
          row.innerHTML = `
            <div class="task-emoji">${emojiFor(a)}</div>
            <div class="task-text">${t}</div>
          `;
          container.appendChild(row);
        }
      }
    }
  } catch(e){
    console.error("Error loading tasks:", e);
  }

            <div class="dot"></div>

    // --- 3-day Forecast (from prediction.txt)
    // Supports:
    // - 3 lines per day: Name, "Emoji temps", Condition (optionally includes a percent at end)
    // - 4 lines per day: Name, "Emoji temps", Condition, Precip%
    async function loadForecast(){
      try{
        const res = await fetch(`prediction.txt?cb=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return;

        const raw = (await res.text()).trim();
        if (!raw) return;

        const lines = raw
          .split("\n")
          .map(l => l.trim())
          .filter(Boolean);

        const days = [];
        let i = 0;

        while (i < lines.length && days.length < 3){
          const name = lines[i++] || "";
          const line2 = lines[i++] || "";
          let condition = lines[i++] || "";
          let pop = "";

          if (!name || !line2) continue;

          if (i < lines.length && /^\d+(\.\d+)?\s*%$/.test(lines[i])){
            pop = lines[i++];
          } else {
            const m = condition.match(/(\d+(\.\d+)?)\s*%$/);
            if (m){
              pop = `${m[1]}%`;
              condition = condition.replace(/\s*\d+(\.\d+)?\s*%$/, "").trim();
            }
          }

          const parts = line2.split(/\s+/).filter(Boolean);
          let emoji = "";
          let temps = "";

          if (parts.length === 1){
            temps = parts[0];
          } else if (/^[\d-]/.test(parts[0])){
            temps = parts.join(" ");
          } else {
            emoji = parts[0];
            temps = parts.slice(1).join(" ");
          }

          days.push({ name, emoji, temps, condition, pop });
        }

        const row = document.getElementById("forecast-row");
        if (!row) return;

        row.innerHTML = "";

        for (const d of days){
          const div = document.createElement("div");
          div.className = "forecast-day";

          const emojiSafe = d.emoji || "";
          const popSafe = (d.pop && d.pop.trim() && d.pop.trim() !== "0%") ? d.pop.trim() : "";

          div.innerHTML = `
            <div class="forecast-top">${d.name}</div>
            <div class="forecast-bottom">
              <div class="forecast-iconbig">${emojiSafe}</div>
              <div class="forecast-right">
                <div class="forecast-temps">${d.temps || ""}</div>
                <div class="forecast-condline">
                  <div class="forecast-cond">${d.condition || ""}</div>
                  ${popSafe ? `<div class="forecast-pop">${popSafe}</div>` : ``}
                </div>
              </div>
            </div>
          `;

          row.appendChild(div);
        }
      } catch(e){
        console.error("Error loading Forecast:", e);
      }
    }


  </script>

  <script>
    (async () => {
      let wakeLock = null;

      async function requestWakeLock(){
        try{
          if ("wakeLock" in navigator){
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch(e){
          // ignore
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") requestWakeLock();
      });

      await requestWakeLock();

      setInterval(() => {
        window.scrollBy(0, 1);
        window.scrollBy(0, -1);
      }, 30000);
    })();
  </script>
